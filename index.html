<title>Long Shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud, playful, a night game in the Garden
   IDEA: a shot chart — rarer answers are deeper shots, from layup to half-court
   PICTURE: a painted half court that fills with your made shots, ball flies to the rim
   COLOUR and TYPE: maple hardwood, green paint, ball orange; Anton + Barlow
   LAYOUT: one centred column, court on top, slip card below, phone first */
:root{color-scheme:light dark;--wood:light-dark(#d9a066,#7a4b26);--wood2:light-dark(#d1975c,#714421);--ink:light-dark(#2a1a0c,#fbefe0);--mute:light-dark(#6a4a2c,#e2c6a6);
--card:#fffdf8;--cink:#24170b;--cmute:#6f6052;--paint:#0b5d3b;--ball:#f26b1d;--hot:#c8102e;--rule:#e6dccb}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;
background:repeating-linear-gradient(90deg,var(--wood) 0 44px,var(--wood2) 44px 46px,var(--wood) 46px 92px),var(--wood)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.28),transparent 55%),linear-gradient(180deg,transparent 70%,rgba(0,0,0,.18))}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:18px 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.logo{font:400 36px/1 Anton,Impact,sans-serif;margin:0;letter-spacing:.4px}
.logo span{color:var(--paint)}
:root[data-theme=dark] .logo span{color:#3fbf7f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .logo span{color:#3fbf7f}}
.pill{font:700 14px/1 "Barlow Condensed",sans-serif;border:2px solid currentColor;border-radius:99px;padding:7px 12px;white-space:nowrap;opacity:.8}
.court{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.25);margin-bottom:14px;background:#d9a066}
.court svg{display:block;width:100%;height:auto;margin:0 auto}
.court.mini svg{max-height:36vh}
.card{background:var(--card);color:var(--cink);border-radius:16px;padding:20px;box-shadow:0 14px 30px rgba(0,0,0,.22)}
h2{font:400 clamp(26px,6.5vw,36px)/1.08 Anton,Impact,sans-serif;margin:4px 0;text-wrap:balance}
.sub{color:var(--cmute);font-size:15px;margin:0}
.meta{display:flex;justify-content:space-between;gap:8px;font:700 14px/1 "Barlow Condensed",sans-serif;color:var(--cmute)}
.clock{font:400 22px/1 Anton,Impact,sans-serif;color:var(--cink);background:#1d1d1d;color:#ffb21e;padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.clock.low{color:#ff3b3b}
.timer{height:8px;border-radius:9px;background:var(--rule);overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;width:100%;background:var(--paint);transition:width .25s linear}
.timer.low i{background:var(--hot)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;font:600 17px Barlow,sans-serif;padding:12px 14px;border:2px solid #d8ccb8;border-radius:10px;background:#fff;color:var(--cink);min-height:48px}
input:focus{outline:none;border-color:var(--paint)}
button{font:400 18px/1 Anton,Impact,sans-serif;letter-spacing:.6px;border:0;border-radius:10px;padding:0 18px;min-height:48px;cursor:pointer;background:var(--ball);color:#fff}
button:focus-visible{outline:3px solid var(--paint);outline-offset:2px}
button.ghost{background:transparent;color:var(--cink);border:2px solid #d8ccb8}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row button{flex:1 1 140px}
.out .row button.ghost{color:var(--ink);border-color:currentColor}
.stamp{display:inline-block;transform:rotate(-4deg);border:3px solid currentColor;border-radius:8px;padding:6px 12px;font:400 28px/1 Anton,Impact,sans-serif;animation:pop .35s ease-out .55s both}
@keyframes pop{from{transform:rotate(-4deg) scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.stamp{animation:none}.timer i{transition:none}}
.res{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.pts{font:400 40px/1 Anton,Impact,sans-serif}
.you{font-weight:700;font-size:18px;margin:8px 0 0}
.deep{font-size:14px;color:var(--cmute);margin:12px 0 0}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tier{border-radius:10px;padding:10px 6px;text-align:center;background:rgba(255,253,248,.88);color:var(--cink)}
.tier b{display:block;font:400 19px/1.1 Anton,Impact,sans-serif}
.tier small{display:block;font:700 13px/1.2 "Barlow Condensed",sans-serif;color:var(--cmute)}
.slip{list-style:none;margin:0;padding:0}
.slip li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.slip li:last-child{border:0}
.slip .n{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--ball);color:#fff;font:700 13px/24px Barlow,sans-serif;text-align:center}
.slip .n.x{background:#bdb3a5}
.slip .q{font-weight:700;font-size:15px}.slip .a{font-size:14px;color:var(--cmute)}
.slip .o{grid-row:span 2;text-align:right;font:400 18px/1.1 Anton,Impact,sans-serif;white-space:nowrap}
.slip .o small{display:block;font:600 13px Barlow,sans-serif;color:var(--cmute)}
.big{font:400 clamp(56px,16vw,84px)/1 Anton,Impact,sans-serif;margin:2px 0}
.how{font-size:15px;margin:14px 0 0}
.toast{min-height:20px;font-size:14px;color:var(--cmute);margin-top:8px}
.foot{font-size:13px;margin-top:20px;text-align:center;color:var(--mute)}
.hide{display:none}
.tabs{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;min-height:40px;font:700 15px "Barlow Condensed",sans-serif;letter-spacing:0;background:#f1e9dc;color:var(--cink);padding:0 12px}
.tabs button.on{background:var(--paint);color:#fff}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.lb li:last-child{border:0}
.lb li.mine{background:#fff3e6;margin:0 -10px;padding:10px;border-radius:10px}
.lb .rk{font:400 22px/1 Anton,Impact,sans-serif;color:var(--cmute);text-align:center}
.lb li:first-child .rk{color:var(--ball)}
.lb .nm{font-weight:700;overflow-wrap:anywhere}.lb .nm small{display:block;font-weight:600;font-size:13px;color:var(--cmute)}
.lb .sc{font:400 26px/1 Anton,Impact,sans-serif;font-variant-numeric:tabular-nums}
#nf{margin-top:14px}
</style>
</head>

function refresh(){if(view==="home")home();else if(view==="board")board();else if(view==="final")boardInto()}
function saveGame(daily,legs,tot,name){
  if(!db||!uid||!canWrite)return Promise.resolve(false);
  const cur=me()||{},doc=JSON.parse(JSON.stringify(cur));delete doc.id;
  doc.name=cleanName(name||doc.name)||"Player";doc.ans=doc.ans||{};doc.days=doc.days||{};
  legs.forEach(l=>{if(!l.hit)return;const k=String(l.pi),a=doc.ans[k]||[];if(!a.includes(l.hit.name))a.push(l.hit.name);doc.ans[k]=a.slice(-60)});
  if(daily&&!doc.days[dkey])doc.days[dkey]={total:tot,legs:legs.map(l=>({pi:l.pi,ans:String(l.ans).slice(0,40),name:l.hit?l.hit.name:"",tier:legTier(l)}))};
  if(!daily){doc.best=Math.max(doc.best||0,tot);doc.practice=(doc.practice||0)+1}
  doc.updated=Date.now();
  writing=writing.then(()=>db.doc("players/"+uid).set(doc)).then(()=>true).catch(e=>{if(e&&e.code==="invalid_argument")canWrite=false;return false});
  return writing;}
function myDaily(){const m=me();if(m&&m.days&&m.days[dkey])return m.days[dkey];return store.get("ls-"+dkey)}

let G=null,timerId=null;
const total=()=>G.legs.reduce((s,l)=>s+legPts(l),0);
const boardNote=()=>dbState==="on"?(canWrite?"":"You can see the leaderboard, but this link doesn't let you post scores. Ask Matt to invite you."):dbState==="off"?"Sign in to Claude to see the leaderboard.":dbState==="slow"?"The leaderboard can't be reached right now.":"Loading the leaderboard…";

function home(){
  view="home";clearInterval(timerId);drawCourt(null,0,false);
  const done=myDaily(),best=Math.max(store.get("ls-best")||0,(me()&&me().best)||0);
  app.className="out";
  app.innerHTML=`<section class="card">
    <div class="meta"><span>TODAY'S GAME</span><span>7 SHOTS</span></div>
    <h2>Name the answer nobody else thinks of.</h2>
    <p class="sub">Every prompt has lots of right answers. The obvious ones are layups. The deep cuts are half-court buzzer-beaters.</p>
    ${done?`<p class="toast">You played today's game: <b>${esc(done.total)} pts</b>. Shoot around in practice until tomorrow.</p>`:""}
    <div class="row">
      ${done?`<button id="see" class="ghost">Today's shot chart</button>`:`<button id="daily">Tip off</button>`}
      <button id="prac" class="ghost">Practice</button>
      <button id="lb" class="ghost">Leaderboard</button>
    </div>
    ${best?`<p class="toast">Best practice game: ${esc(best)} pts</p>`:""}
  </section>
  <div class="tiers">${TIERS.map(t=>`<div class="tier"><b style="color:${t.c}">${t.k}</b><small>${t.p} pts · ${t.d}</small></div>`).join("")}</div>
  <p class="how"><b>Scoring:</b> a right answer is graded by how rare it is, from Layup (10) to Half-court (100). Once five or more players have answered a prompt, rarity starts following what the group actually says. Wrong or blank is an airball. A perfect game is 700.</p>`;
  const b=id=>document.getElementById(id);
  if(b("daily"))b("daily").onclick=()=>start(true);
  if(b("see"))b("see").onclick=()=>{G={daily:true,legs:done.legs.map(l=>({pi:l.pi,ans:l.ans,tier:legTier(l),hit:l.hit||(l.name?{name:l.name,tier:l.tier}:null)})),i:7,saved:true};final()};
  b("prac").onclick=()=>start(false);b("lb").onclick=board;
}
function boardHTML(mode){
  const rows=mode==="today"?players.filter(p=>p.days&&p.days[dkey]).map(p=>({p,v:+p.days[dkey].total||0,legs:p.days[dkey].legs||[]}))
   :mode==="all"?players.map(p=>{const d=Object.values(p.days||{});return{p,v:d.reduce((s,x)=>s+(+x.total||0),0),g:d.length}}).filter(r=>r.g)
   :players.filter(p=>p.best).map(p=>({p,v:+p.best||0}));
  rows.sort((a,b)=>b.v-a.v);
  if(!rows.length)return`<p class="sub" style="padding:14px 0">${mode==="today"?"No one has played today's game yet.":"No scores yet."}</p>`;
  return`<ol class="lb">${rows.slice(0,50).map((r,i)=>`<li class="${r.p.id===uid?"mine":""}"><span class="rk">${i+1}</span><span class="nm">${esc(cleanName(r.p.name)||"Player")}${r.legs?`<small>${r.legs.map(l=>{const t=legTier(l);return t<0?"X":TIERS[t].s}).map(esc).join(" · ")}</small>`:r.g?`<small>${r.g} game${r.g>1?"s":""}</small>`:""}</span><span class="sc">${esc(r.v)}</span></li>`).join("")}</ol>`;}
let lbMode="today";
function lbTabs(){return`<div class="tabs" role="tablist">${[["today","Today"],["all","All-time"],["best","Practice best"]].map(([k,l])=>`<button role="tab" aria-selected="${lbMode===k}" data-m="${k}" class="${lbMode===k?"on":""}">${l}</button>`).join("")}</div>`}
function bindTabs(fn){app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{lbMode=b.dataset.m;fn()})}
function board(){
  view="board";clearInterval(timerId);drawCourt(null,0,true);app.className="out";
  app.innerHTML=`<section class="card"><div class="meta"><span>LEADERBOARD · ${esc(dLabel)}</span><span>${players.length} PLAYER${players.length===1?"":"S"}</span></div>
  <h2>Who's got range?</h2>${lbTabs()}<div>${dbState==="on"?boardHTML(lbMode):""}</div><p class="toast">${esc(boardNote())}</p></section>
  <div class="row"><button id="hm" class="ghost">Back to start</button></div>`;
  bindTabs(board);document.getElementById("hm").onclick=home;
}
function start(daily){
  if(daily&&myDaily())return home();
  const r=daily?rng("longshot-"+dkey):Math.random;
  G={daily,legs:pick7(r).map(pi=>({pi,ans:"",hit:null,tier:-1})),i:0};view="play";ask();
}
function ask(){
  const L=G.legs[G.i],p=P[L.pi];let left=25;
  drawCourt(G.legs,G.i,true);app.className="";
  app.innerHTML=`<section class="card">
    <div class="meta"><span>SHOT ${G.i+1} OF 7 · ${total()} PTS</span><span class="clock" id="sec">:25</span></div>
    <h2>${esc(p.q)}</h2>
    <div class="timer" id="tb"><i id="bar"></i></div>
    <form id="f" autocomplete="off"><input id="in" aria-label="Your answer" placeholder="Type your answer" autocapitalize="off" spellcheck="false" maxlength="60"><button>Shoot</button></form>
  </section>`;
  const inp=document.getElementById("in");inp.focus();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();lock(inp.value)};
  clearInterval(timerId);
  timerId=setInterval(()=>{left-=.25;const s=Math.max(0,Math.ceil(left));
    document.getElementById("bar").style.width=Math.max(0,left/25*100)+"%";
    const c=document.getElementById("sec");c.textContent=":"+String(s).padStart(2,"0");
    if(left<=6){document.getElementById("tb").classList.add("low");c.classList.add("low")}
    if(left<=0)lock(inp.value)},250);
}
function lock(v){
  clearInterval(timerId);const L=G.legs[G.i],p=P[L.pi];L.ans=v.trim();L.hit=match(p,v);
  const ft=finalTier(L.pi,L.hit);L.tier=ft.tier;
  const h=L.hit,t=L.tier>=0?TIERS[L.tier]:null;
  drawCourt(G.legs,G.i,true);shoot(L.tier,G.i,!!t);
  setTimeout(()=>{if(G&&G.legs[G.i]===L)drawCourt(G.legs,G.i+1,true)},800);
  const deep=p.list.filter(x=>x.tier>=4&&(!h||x.name!==h.name)).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.name);
  app.innerHTML=`<section class="card">
    <div class="meta"><span>SHOT ${G.i+1} OF 7</span><span>${t?"BUCKET":"AIRBALL"}</span></div>
    <h2>${esc(p.q)}</h2>
    <p class="you">${L.ans?`You said: ${esc(L.ans)}${h&&norm(h.name)!==norm(L.ans)?` <span style="color:var(--cmute);font-weight:600">(${esc(h.name)})</span>`:""}`:"Shot clock violation."}</p>
    <div class="res"><span class="stamp" style="color:${t?t.c:"#c8102e"}">${t?t.k.toUpperCase()+"!":"AIRBALL"}</span><span class="pts">+${t?t.p:0}</span></div>
    ${h&&ft.n>=5?`<p class="deep">${ft.c} of ${ft.n} other players said this.</p>`:""}
    ${deep.length?`<p class="deep">Half-court and logo answers: ${deep.map(esc).join(", ")}</p>`:""}
    <div class="row"><button id="nx">${G.i<6?"Next shot":"Final buzzer"}</button></div>
  </section>`;
  const nx=document.getElementById("nx");nx.focus();
  nx.onclick=()=>{G.i++;G.i<7?ask():final()};
}
function rank(n){return n<150?"Benchwarmer":n<300?"Sixth man":n<450?"Starter":n<600?"All-Star":"Hall of Famer"}
function boardInto(){const el=document.getElementById("fb");if(!el)return;
  el.innerHTML=`<div class="meta"><span>TODAY'S LEADERBOARD</span><span></span></div>${lbTabs()}<div>${dbState==="on"?boardHTML(lbMode):""}</div><p class="toast">${esc(boardNote())}</p>`;
  bindTabs(boardInto);}
function final(){
  view="final";clearInterval(timerId);const tot=total();
  drawCourt(G.legs,7,false);
  if(G.daily&&!store.get("ls-"+dkey))store.set("ls-"+dkey,{total:tot,legs:G.legs.map(l=>({pi:l.pi,ans:l.ans,name:l.hit?l.hit.name:"",tier:legTier(l)}))});
  if(!G.daily&&tot>(store.get("ls-best")||0))store.set("ls-best",tot);
  const needName=!G.saved&&db&&canWrite&&!(me()&&me().name);
  const savedName=store.get("ls-name")||"";
  app.className="out";
  app.innerHTML=`<section class="card">
    <div class="meta"><span>${G.daily?"TODAY · "+esc(dLabel):"PRACTICE"}</span><span>FINAL</span></div>
    <div class="big">${tot}</div><p class="sub"><b>${rank(tot)}</b> · out of 700</p>
    <form id="nf" class="${needName?"":"hide"}" autocomplete="off"><input id="nm" maxlength="20" aria-label="Your name for the leaderboard" placeholder="Your name for the leaderboard" value="${esc(savedName)}"><button>Post score</button></form>
    <p class="toast" id="sv"></p>
    <ul class="slip" style="margin-top:6px">${G.legs.map((l,i)=>{const tr=legTier(l),t=tr>=0?TIERS[tr]:null;return`<li><span class="n${t?"":" x"}">${i+1}</span><span class="q">${esc(P[l.pi].q)}</span><span class="o" style="color:${t?t.c:"#c8102e"}">${t?t.k:"Airball"}<small>+${t?t.p:0}</small></span><span class="a">${l.ans?esc(l.ans):"No answer"}</span></li>`}).join("")}</ul>
    <p class="deep">Share key: 🏀 layup · 🎯 free throw · 💪 mid-range · 👌 three · 🔥 logo · 🚀 half-court · 🧱 airball</p>
    <div class="row"><button id="cp">Copy result for the chat</button><button id="again" class="ghost">Practice</button></div>
    <p class="toast" id="msg" style="white-space:pre-line"></p>
  </section>
  <section class="card" id="fb" style="margin-top:14px"></section>
  <div class="row"><button id="hm" class="ghost">Back to start</button></div>`;
  boardInto();
  const sv=document.getElementById("sv");
  const post=name=>{G.saved=true;sv.textContent="Posting…";
    saveGame(G.daily,G.legs,tot,name).then(ok=>{sv.textContent=ok?"Score posted.":boardNote()||"Couldn't post this score."})};
  if(!G.saved&&db&&canWrite&&!needName)post();
  else if(!G.saved&&dbState!=="on")sv.textContent=boardNote();
  document.getElementById("nf").onsubmit=e=>{e.preventDefault();const n=cleanName(document.getElementById("nm").value);if(!n){sv.textContent="Add a name first.";return}
    store.set("ls-name",n);document.getElementById("nf").classList.add("hide");post(n)};
  document.getElementById("again").onclick=()=>start(false);
  document.getElementById("hm").onclick=home;
  document.getElementById("cp").onclick=()=>{
    const EMO=["🏀","🎯","💪","👌","🔥","🚀"],gameNo=Math.floor((new Date(dkey+"T12:00:00")-new Date("2026-11-24T12:00:00"))/864e5)+1;
    const txt=`Long Shot ${G.daily?"#"+gameNo:"practice"} 🏀 ${tot}\n\n`+G.legs.map(l=>{const t=legTier(l);return t<0?"🧱":EMO[t]}).join("")+`\n\n${SHARE_URL}`;
    const m=document.getElementById("msg");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>m.textContent="Copied. Paste it in the group chat:\n\n"+txt).catch(()=>m.textContent=txt);
  };
}
home();
}
</script>
</body>
</html>
